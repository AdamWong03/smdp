name: SACMP canonical structure
on:
  push:
    paths:
      - 'sacmp/**'
      - '.github/workflows/sacmp-structure.yml'
  workflow_dispatch:
jobs:
  canonical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy scipy h5py vesin
      - name: Run canonical map invariants
        run: python -m pytest -q sacmp/tests
